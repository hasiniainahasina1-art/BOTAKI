<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BOTAKI - DLV & Prix</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --navy-deep: #131c42;
            --navy: #1e2f6b;
            --blue: #2d4593;
            --gold: #f4b400;
            --gold-light: #ffd54f;
            --ink: #f5f6fb;
            --ink-muted: #a9b3d6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(180deg, var(--navy-deep) 0%, var(--navy) 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            color: var(--ink);
            padding: 1rem;
        }
        .container { max-width: 520px; margin: 0 auto; }

        #selectionScreen { display: block; }
        #entryScreen { display: none; }

        .header { text-align: center; padding: 1.5rem 0 1rem; }
        .header h1 { font-size: 1.5rem; font-weight: 700; color: var(--gold-light); }
        .header p { font-size: 0.85rem; color: var(--ink-muted); margin-top: 0.3rem; }

        .card {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(244,180,0,0.25);
            border-radius: 20px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            backdrop-filter: blur(8px);
        }
        .card h2 {
            font-size: 0.9rem;
            color: var(--gold-light);
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
        .choice-grid.three { grid-template-columns: 1fr 1fr 1fr; }

        .choice-btn {
            padding: 1rem 0.5rem;
            border-radius: 14px;
            border: 2px solid rgba(244,180,0,0.3);
            background: rgba(255,255,255,0.05);
            color: var(--ink);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .choice-btn:hover { border-color: var(--gold); background: rgba(244,180,0,0.1); }
        .choice-btn.selected {
            border-color: var(--gold);
            background: linear-gradient(135deg, var(--gold) 0%, #d99a00 100%);
            color: var(--navy-deep);
        }

        .btn-primary {
            width: 100%;
            padding: 0.9rem;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--gold) 0%, #d99a00 100%);
            color: var(--navy-deep);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: 0.2s;
        }
        .btn-primary:disabled { background: #555; color: #999; cursor: not-allowed; }
        .btn-primary:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(244,180,0,0.3); }

        .btn-back {
            background: transparent;
            border: 1px solid rgba(244,180,0,0.4);
            color: var(--gold-light);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            margin-bottom: 0.8rem;
        }

        .context-badge { display: inline-flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
        .badge {
            background: rgba(244,180,0,0.15);
            border: 1px solid rgba(244,180,0,0.4);
            color: var(--gold-light);
            padding: 0.25rem 0.7rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .field-group { margin-bottom: 0.8rem; }
        .field-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--ink-muted);
            margin-bottom: 0.25rem;
        }
        .field-group input {
            width: 100%;
            padding: 0.65rem 0.8rem;
            border-radius: 12px;
            border: 1.5px solid rgba(244,180,0,0.35);
            background: rgba(255,255,255,0.08);
            color: var(--ink);
            font-size: 0.95rem;
        }
        .field-group input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 2px rgba(244,180,0,0.2);
        }
        .field-group input.valid { border-color: #10b981; background: rgba(16,185,129,0.1); }
        .field-group input.invalid { border-color: #ef4444; background: rgba(239,68,68,0.1); }

        .row-2 { display: flex; gap: 0.7rem; }
        .row-2 .field-group { flex: 1; }

        .designation-box {
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 0.6rem 0.8rem;
            font-size: 0.85rem;
            color: var(--gold-light);
            min-height: 2.4rem;
            margin-bottom: 0.8rem;
        }

        .btn-row { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.5rem; }
        .btn {
            padding: 0.7rem 1.1rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        .btn-add { background: var(--gold); color: var(--navy-deep); flex: 1; }
        .btn-add:disabled { background: #555; color: #999; cursor: not-allowed; }
        .btn-nonbase { background: transparent; border: 2px solid #ef4444; color: #fca5a5; }
        .btn-save { background: var(--blue); color: white; width: 100%; margin-top: 0.6rem; }

        .status-bar {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30,47,107,0.92);
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            font-size: 0.75rem;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .status-bar.show { opacity: 1; }

        .table-card { margin-top: 1rem; }
        .table-wrapper { overflow-x: auto; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        th {
            background: rgba(244,180,0,0.15);
            color: var(--gold-light);
            padding: 0.5rem 0.4rem;
            text-align: left;
            white-space: nowrap;
        }
        td {
            padding: 0.45rem 0.4rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            color: var(--ink);
        }
        tr.hors-base { background: rgba(239,68,68,0.12); }
        .del-btn {
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.15rem 0.45rem;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .info-scan { font-size: 0.7rem; color: var(--ink-muted); margin-top: 0.2rem; }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .overlay.show { display: flex; }
        .modal {
            background: var(--navy);
            border: 1px solid rgba(244,180,0,0.4);
            border-radius: 18px;
            padding: 1.4rem;
            max-width: 360px;
            width: 100%;
            text-align: center;
        }
        .modal h3 { color: var(--gold-light); margin-bottom: 0.6rem; font-size: 1.05rem; }
        .modal p { color: var(--ink-muted); font-size: 0.85rem; margin-bottom: 1rem; line-height: 1.4; white-space: pre-line; }
        .modal-btns { display: flex; gap: 0.6rem; }
        .modal-btns button { flex: 1; padding: 0.7rem; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; }
        .modal-ok { background: var(--gold); color: var(--navy-deep); }
        .modal-cancel { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: var(--ink); }

        @media (max-width: 400px) {
            .choice-grid.three { grid-template-columns: 1fr; }
            .row-2 { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- SELECTION SCREEN -->
    <div id="selectionScreen">
        <div class="header">
            <h1>DLV & Prix</h1>
            <p>Choisissez le dossier puis la catégorie</p>
        </div>

        <div class="card">
            <h2>1. Dossier</h2>
            <div class="choice-grid">
                <button class="choice-btn" data-folder="KIBO4">KIBO4</button>
                <button class="choice-btn" data-folder="KIBO2">KIBO2</button>
            </div>
        </div>

        <div class="card">
            <h2>2. Catégorie</h2>
            <div class="choice-grid three">
                <button class="choice-btn" data-cat="Épicerie">Épicerie</button>
                <button class="choice-btn" data-cat="Boisson">Boisson</button>
                <button class="choice-btn" data-cat="DPH">DPH</button>
            </div>
        </div>

        <button class="btn-primary" id="btnStart" disabled>Continuer →</button>
    </div>

    <!-- ENTRY SCREEN -->
    <div id="entryScreen">
        <button class="btn-back" id="btnBack">← Retour</button>

        <div class="context-badge">
            <span class="badge" id="badgeFolder">—</span>
            <span class="badge" id="badgeCat">—</span>
        </div>

        <div class="card">
            <div class="field-group">
                <label>Code-barres / Code article</label>
                <input type="text" id="codeInput" placeholder="Scanner ou taper (double-clic = scanner)" autocomplete="off">
                <div class="info-scan">💡 Double-clic pour ouvrir le scanner</div>
            </div>

            <div class="designation-box" id="designationBox">Désignation…</div>

            <div class="row-2">
                <div class="field-group">
                    <label>Prix Normale (Ar)</label>
                    <input type="number" id="prixNormale" placeholder="0" min="0" inputmode="numeric">
                </div>
                <div class="field-group">
                    <label>Quantité</label>
                    <input type="number" id="quantite" value="1" min="1" max="999999" inputmode="numeric">
                </div>
            </div>

            <div class="field-group">
                <label>Date Limite de Vente (DLV)</label>
                <input type="date" id="dlv">
            </div>

            <div class="btn-row">
                <button class="btn btn-add" id="addBtn" disabled>➕ Ajouter</button>
                <button class="btn btn-nonbase" id="nonBaseBtn">⚠️ Hors base</button>
            </div>
        </div>

        <div class="card table-card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.6rem;">
                <h2 style="margin:0;font-size:0.85rem;color:var(--gold-light);">Lignes de la session</h2>
                <span id="lineCount" style="font-size:0.75rem;color:var(--ink-muted);">0 ligne(s)</span>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Désignation</th>
                            <th>Prix</th>
                            <th>Qté</th>
                            <th>DLV</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="6" style="text-align:center;color:var(--ink-muted);">Aucune ligne</td></tr>
                    </tbody>
                </table>
            </div>
            <button class="btn btn-save" id="saveBtn">💾 Enregistrer dans Excel</button>
        </div>
    </div>
</div>

<div class="status-bar" id="statusBar">Sauvegardé</div>

<div class="overlay" id="alertOverlay">
    <div class="modal">
        <h3 id="alertTitle">Attention</h3>
        <p id="alertMessage"></p>
        <div class="modal-btns">
            <button class="modal-cancel" id="alertCancel">Annuler</button>
            <button class="modal-ok" id="alertOk">OK</button>
        </div>
    </div>
</div>

<script>
(function () {
    const EXCEL_URL = 'https://raw.githubusercontent.com/hasiniainahasina1-art/BOTAKI/main/database.xlsx';
    const API_URL = '/api/dlv-prix';

    let selectedFolder = null;
    let selectedCat = null;
    let produitsDB = [];
    let baseChargee = false;
    let sessionLignes = [];
    let remoteSheets = null;
    let remoteSha = null;
    let dernierProduit = null;

    const selectionScreen = document.getElementById('selectionScreen');
    const entryScreen = document.getElementById('entryScreen');
    const btnStart = document.getElementById('btnStart');
    const btnBack = document.getElementById('btnBack');
    const badgeFolder = document.getElementById('badgeFolder');
    const badgeCat = document.getElementById('badgeCat');
    const codeInput = document.getElementById('codeInput');
    const designationBox = document.getElementById('designationBox');
    const prixNormale = document.getElementById('prixNormale');
    const quantite = document.getElementById('quantite');
    const dlv = document.getElementById('dlv');
    const addBtn = document.getElementById('addBtn');
    const nonBaseBtn = document.getElementById('nonBaseBtn');
    const saveBtn = document.getElementById('saveBtn');
    const tableBody = document.getElementById('tableBody');
    const lineCount = document.getElementById('lineCount');
    const statusBar = document.getElementById('statusBar');
    const alertOverlay = document.getElementById('alertOverlay');
    const alertTitle = document.getElementById('alertTitle');
    const alertMessage = document.getElementById('alertMessage');
    const alertOk = document.getElementById('alertOk');
    const alertCancel = document.getElementById('alertCancel');

    function normaliser(code) {
        return (code || '').toString().replace(/[\s.\-]/g, '').toLowerCase();
    }

    function showStatus(msg) {
        statusBar.textContent = msg;
        statusBar.classList.add('show');
        setTimeout(() => statusBar.classList.remove('show'), 2200);
    }

    function formaterDateFr(iso) {
        if (!iso) return '';
        const [y, m, d] = iso.split('-');
        return `${d}/${m}/${y}`;
    }

    function showAlert(title, message) {
        return new Promise(resolve => {
            alertTitle.textContent = title;
            alertMessage.textContent = message;
            alertOverlay.classList.add('show');
            const onOk = () => { cleanup(); resolve(true); };
            const onCancel = () => { cleanup(); resolve(false); };
            function cleanup() {
                alertOverlay.classList.remove('show');
                alertOk.removeEventListener('click', onOk);
                alertCancel.removeEventListener('click', onCancel);
            }
            alertOk.addEventListener('click', onOk);
            alertCancel.addEventListener('click', onCancel);
        });
    }

    // Selection
    document.querySelectorAll('[data-folder]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('[data-folder]').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedFolder = btn.dataset.folder;
            btnStart.disabled = !(selectedFolder && selectedCat);
        });
    });
    document.querySelectorAll('[data-cat]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedCat = btn.dataset.cat;
            btnStart.disabled = !(selectedFolder && selectedCat);
        });
    });

    btnStart.addEventListener('click', async () => {
        badgeFolder.textContent = selectedFolder;
        badgeCat.textContent = selectedCat;
        selectionScreen.style.display = 'none';
        entryScreen.style.display = 'block';
        sessionLignes = [];
        renderSessionTable();
        showStatus('Chargement…');
        await Promise.all([chargerBase(), chargerRemote()]);
        showStatus('Prêt');
        codeInput.focus();
    });

    btnBack.addEventListener('click', () => {
        entryScreen.style.display = 'none';
        selectionScreen.style.display = 'block';
        sessionLignes = [];
    });

    async function chargerBase() {
        try {
            const resp = await fetch(EXCEL_URL, { cache: 'no-store' });
            if (!resp.ok) throw new Error('Impossible de charger la base');
            const buf = await resp.arrayBuffer();
            const wb = XLSX.read(buf, { type: 'array' });
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
            let start = 0;
            if (rows[0] && /code|barre|article|désign/i.test(String(rows[0][0]))) start = 1;
            produitsDB = [];
            for (let i = start; i < rows.length; i++) {
                const r = rows[i];
                if (!r || (!r[0] && !r[1])) continue;
                produitsDB.push({
                    codeBarre: String(r[0] || '').trim(),
                    codeArticle: String(r[1] || '').trim(),
                    designation: String(r[2] || '').trim()
                });
            }
            baseChargee = true;
        } catch (e) {
            console.error(e);
            baseChargee = false;
            await showAlert('Erreur', 'Impossible de charger la base articles. Vous pouvez quand même saisir en hors-base.');
        }
    }

    async function chargerRemote() {
        try {
            const resp = await fetch(`${API_URL}?folder=${selectedFolder}`);
            const data = await resp.json();
            if (!data.success) throw new Error(data.error || 'Erreur API');
            remoteSheets = data.sheets;
            remoteSha = data.sha;
        } catch (e) {
            console.error(e);
            remoteSheets = { 'Épicerie': [], 'Boisson': [], 'DPH': [] };
            remoteSha = null;
        }
    }

    function rechercherProduit(code) {
        const n = normaliser(code);
        if (!n) return null;
        return produitsDB.find(p =>
            normaliser(p.codeBarre) === n || normaliser(p.codeArticle) === n
        ) || null;
    }

    function mettreAJourDesignation() {
        const code = codeInput.value.trim();
        if (!code) {
            designationBox.textContent = 'Désignation…';
            codeInput.classList.remove('valid', 'invalid');
            addBtn.disabled = true;
            dernierProduit = null;
            return;
        }
        const p = rechercherProduit(code);
        if (p) {
            designationBox.textContent = p.designation || '(sans désignation)';
            codeInput.classList.add('valid');
            codeInput.classList.remove('invalid');
            addBtn.disabled = false;
            dernierProduit = p;
        } else {
            designationBox.textContent = '⚠️ Produit non trouvé dans la base';
            codeInput.classList.add('invalid');
            codeInput.classList.remove('valid');
            addBtn.disabled = true;
            dernierProduit = null;
        }
    }

    codeInput.addEventListener('input', mettreAJourDesignation);
    codeInput.addEventListener('blur', mettreAJourDesignation);

    codeInput.addEventListener('dblclick', () => window.open('scan.html', '_blank'));
    window.addEventListener('storage', (e) => {
        if (e.key === 'scannedCode' && e.newValue) {
            codeInput.value = e.newValue;
            codeInput.dispatchEvent(new Event('input'));
            localStorage.removeItem('scannedCode');
            dlv.focus();
        }
    });

    function buildLigne(prod, horsBase) {
        return {
            codeBarre: horsBase ? codeInput.value.trim() : (prod.codeBarre || codeInput.value.trim()),
            codeArticle: horsBase ? codeInput.value.trim() : (prod.codeArticle || ''),
            designation: horsBase ? (codeInput.value.trim() || 'Hors base') : (prod.designation || ''),
            prixNormale: prixNormale.value || '',
            prixPromo: '',
            quantite: quantite.value || '1',
            dlv: formaterDateFr(dlv.value) || '',
            horsBase: !!horsBase
        };
    }

    function resetForm() {
        codeInput.value = '';
        designationBox.textContent = 'Désignation…';
        codeInput.classList.remove('valid', 'invalid');
        prixNormale.value = '';
        quantite.value = '1';
        dlv.value = '';
        addBtn.disabled = true;
        dernierProduit = null;
        codeInput.focus();
    }

    async function ajouterDepuisBase() {
        if (!dernierProduit) return;
        const ligne = buildLigne(dernierProduit, false);
        await ajouterOuMaj(ligne);
    }

    async function ajouterHorsBase() {
        const code = codeInput.value.trim();
        if (!code) {
            await showAlert('Attention', 'Veuillez saisir un code-barres ou code article.');
            return;
        }
        if (dernierProduit) {
            const ok = await showAlert(
                'Produit trouvé',
                `Ce code correspond à « ${dernierProduit.designation} ».\nVoulez-vous quand même l'ajouter comme hors-base ?`
            );
            if (!ok) return;
        } else {
            const ok = await showAlert(
                'Produit non trouvé',
                'Ce code n\'existe pas dans la base.\nVérifiez le code-barres ou le code article.\n\nCliquez OK si le code est exact pour l\'ajouter en hors-base.'
            );
            if (!ok) return;
        }
        const ligne = buildLigne(dernierProduit || { codeBarre: code, codeArticle: code, designation: code }, true);
        await ajouterOuMaj(ligne);
    }

    async function ajouterOuMaj(ligne) {
        const idxSession = sessionLignes.findIndex(l =>
            normaliser(l.codeBarre) === normaliser(ligne.codeBarre) ||
            (l.codeArticle && normaliser(l.codeArticle) === normaliser(ligne.codeArticle))
        );
        const remoteList = (remoteSheets && remoteSheets[selectedCat]) || [];
        const idxRemote = remoteList.findIndex(l =>
            normaliser(l.codeBarre) === normaliser(ligne.codeBarre) ||
            (l.codeArticle && normaliser(l.codeArticle) === normaliser(ligne.codeArticle))
        );

        if (idxSession >= 0 || idxRemote >= 0) {
            const ok = await showAlert(
                'Produit déjà présent',
                'Ce produit existe déjà. Voulez-vous le mettre à jour avec les nouvelles valeurs ?'
            );
            if (!ok) return;
            if (idxSession >= 0) sessionLignes[idxSession] = ligne;
            else sessionLignes.push(ligne);
        } else {
            sessionLignes.push(ligne);
        }
        renderSessionTable();
        resetForm();
        showStatus('Ligne ajoutée');
    }

    addBtn.addEventListener('click', ajouterDepuisBase);
    nonBaseBtn.addEventListener('click', ajouterHorsBase);

    function renderSessionTable() {
        lineCount.textContent = `${sessionLignes.length} ligne(s)`;
        if (sessionLignes.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--ink-muted);">Aucune ligne</td></tr>';
            return;
        }
        tableBody.innerHTML = sessionLignes.map((l, i) => `
            <tr class="${l.horsBase ? 'hors-base' : ''}">
                <td>${escapeHtml(l.codeBarre || l.codeArticle)}</td>
                <td>${escapeHtml(l.designation)}</td>
                <td>${l.prixNormale || '—'}</td>
                <td>${l.quantite || '—'}</td>
                <td>${l.dlv || '—'}</td>
                <td><button class="del-btn" data-i="${i}">✕</button></td>
            </tr>
        `).join('');
        tableBody.querySelectorAll('.del-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                sessionLignes.splice(parseInt(btn.dataset.i), 1);
                renderSessionTable();
            });
        });
    }

    function escapeHtml(s) {
        return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    saveBtn.addEventListener('click', async () => {
        if (sessionLignes.length === 0) {
            await showAlert('Info', 'Aucune ligne à enregistrer.');
            return;
        }
        saveBtn.disabled = true;
        saveBtn.textContent = 'Enregistrement…';
        showStatus('Enregistrement en cours…');
        try {
            await chargerRemote();
            const sheetRows = (remoteSheets[selectedCat] || []).slice();
            const nouvelles = [];
            for (const ligne of sessionLignes) {
                const idx = sheetRows.findIndex(r =>
                    normaliser(r.codeBarre) === normaliser(ligne.codeBarre) ||
                    (r.codeArticle && normaliser(r.codeArticle) === normaliser(ligne.codeArticle))
                );
                const rowData = {
                    codeBarre: ligne.codeBarre,
                    codeArticle: ligne.codeArticle,
                    designation: ligne.designation,
                    prixNormale: ligne.prixNormale,
                    prixPromo: ligne.prixPromo || '',
                    quantite: ligne.quantite,
                    dlv: ligne.dlv
                };
                if (idx >= 0) {
                    if (!rowData.prixPromo && sheetRows[idx].prixPromo) {
                        rowData.prixPromo = sheetRows[idx].prixPromo;
                    }
                    sheetRows[idx] = rowData;
                } else {
                    nouvelles.push(rowData);
                }
            }
            // Nouvelles lignes en tête (plus récentes en avant)
            const finalRows = [...nouvelles, ...sheetRows];
            const newSheets = { ...remoteSheets, [selectedCat]: finalRows };
            const resp = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ folder: selectedFolder, sheets: newSheets, sha: remoteSha })
            });
            const result = await resp.json();
            if (!result.success) throw new Error(result.error || 'Erreur sauvegarde');
            remoteSha = result.sha;
            remoteSheets = newSheets;
            sessionLignes = [];
            renderSessionTable();
            showStatus('✅ Enregistré avec succès');
            await showAlert('Succès', `Les lignes ont été enregistrées dans ${selectedFolder} → ${selectedCat}.`);
        } catch (e) {
            console.error(e);
            await showAlert('Erreur', 'Échec de l\'enregistrement : ' + (e.message || e));
        } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = '💾 Enregistrer dans Excel';
        }
    });
})();
</script>
</body>
</html>
