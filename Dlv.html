<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BOTAKI - Dlv & Prix</title>

    <!-- XLSX pour lecture base produits -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Handsontable — tableur Excel dans le navigateur -->
    <link  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@14.3.0/dist/handsontable.full.min.css">
    <script src="https://cdn.jsdelivr.net/npm/handsontable@14.3.0/dist/handsontable.full.min.js"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --navy:#1e2f6b; --gold:#f4b400; --gold-light:#ffd54f;
            --blue:#0b3b5f; --red:#dc2626; --green:#10b981;
        }
        body {
            background: linear-gradient(145deg,#b8e1fc 0%,#e0f2fe 100%);
            font-family:'Segoe UI',Roboto,system-ui,sans-serif;
            padding:1rem; min-height:100vh;
        }
        .container { max-width:740px; margin:0 auto; }

        /* ── HEADER ── */
        .header {
            display:flex; align-items:center; gap:.8rem; margin-bottom:1rem;
        }
        .back-btn {
            background:var(--navy); color:white; border:none;
            border-radius:50%; width:36px; height:36px;
            font-size:1.1rem; cursor:pointer;
            display:flex; align-items:center; justify-content:center; flex-shrink:0;
        }
        .header-info { flex:1; }
        .header-title { font-size:1rem; font-weight:700; color:var(--navy); }
        .header-sub   { font-size:.72rem; color:#555; margin-top:2px; }
        .badge {
            background:var(--gold); color:var(--navy);
            font-weight:700; font-size:.75rem;
            padding:.3rem .8rem; border-radius:20px; white-space:nowrap;
        }

        /* ── CARD ── */
        .card {
            background:rgba(255,255,255,.95);
            border-radius:24px; padding:1rem 1.2rem;
            margin-bottom:1.2rem;
            box-shadow:0 8px 20px rgba(0,0,0,.1);
            border:1px solid rgba(244,180,0,.6);
        }

        /* ── MODAL ── */
        .overlay {
            position:fixed; inset:0;
            background:rgba(0,0,0,.55);
            display:flex; align-items:center; justify-content:center;
            z-index:200; backdrop-filter:blur(4px);
        }
        .overlay.hidden { display:none; }
        .modal-box {
            background:white; border-radius:24px;
            padding:1.5rem; width:92%; max-width:360px;
            box-shadow:0 20px 50px rgba(0,0,0,.3);
            animation:popIn .2s ease;
        }
        @keyframes popIn { from{transform:scale(.85);opacity:0} to{transform:scale(1);opacity:1} }
        .modal-title {
            font-size:1rem; font-weight:700; color:var(--navy);
            margin-bottom:1.2rem; text-align:center;
        }
        .modal-grid { display:grid; grid-template-columns:1fr 1fr; gap:.8rem; }
        .modal-grid.three { grid-template-columns:1fr 1fr 1fr; }
        .modal-btn {
            padding:.9rem .5rem; border-radius:16px;
            border:2px solid var(--gold);
            background:white; color:var(--navy);
            font-weight:700; font-size:.85rem;
            cursor:pointer; transition:all .18s; text-align:center;
        }
        .modal-btn:hover { background:var(--gold); transform:scale(1.04); }

        /* ── FORMULAIRE ── */
        .form-vertical { display:flex; flex-direction:column; gap:.9rem; margin-bottom:1rem; }
        .field-group   { display:flex; flex-direction:column; gap:.2rem; }
        .row-two { display:flex; gap:1rem; }
        .row-two .field-group { flex:1; }
        label {
            font-weight:700; font-size:.7rem;
            text-transform:uppercase; color:var(--blue);
        }
        input {
            padding:.5rem .7rem; border-radius:20px;
            border:1.5px solid var(--gold);
            font-size:.78rem; background:white; width:100%;
        }
        input:focus { outline:none; border-color:var(--navy); box-shadow:0 0 0 2px rgba(30,47,107,.15); }
        .valid   { border-color:var(--green) !important; background:#f0fdf4; }
        .invalid { border-color:var(--red)   !important; background:#fef2f2; }
        .desig-text {
            font-size:.75rem; font-weight:500; color:var(--blue);
            min-height:1rem; margin-top:2px; padding-left:4px;
        }

        /* ── BOUTONS ── */
        .btn-row { display:flex; flex-wrap:wrap; gap:.8rem; margin-top:.3rem; }
        button {
            padding:.5rem 1.2rem; border-radius:40px;
            font-weight:700; font-size:.8rem; border:none;
            cursor:pointer; transition:all .2s;
            display:inline-flex; align-items:center; gap:.4rem;
        }
        .btn-add     { background:var(--gold);  color:var(--navy); }
        .btn-add:disabled { background:#e2e8f0; color:#94a3b8; cursor:not-allowed; }
        .btn-nonbase { background:white; color:var(--red); border:2px solid #ef4444; }
        .btn-save    { background:var(--green); color:white; }
        .btn-cancel  { background:#e2e8f0; color:#374151; }

        /* ── TABLE SAISIE ── */
        .tbl-wrap { overflow-x:auto; border-radius:16px; border:1px solid var(--gold); background:white; }
        table { width:100%; border-collapse:collapse; font-size:.73rem; }
        th { background:#fef9e6; padding:.55rem .5rem; text-align:left; border-bottom:2px solid var(--gold); white-space:nowrap; }
        td { padding:.45rem .5rem; border-bottom:1px solid #fef3c7; }
        .del-btn { background:var(--red); color:white; padding:.2rem .6rem; border-radius:30px; font-size:.68rem; }

        /* ── VISU TABLEUR ── */
        #visuSection { display:none; }
        .tabs { display:flex; gap:.5rem; margin-bottom:.8rem; flex-wrap:wrap; }
        .tab-btn {
            padding:.45rem 1rem; border-radius:20px;
            border:2px solid var(--gold); background:white;
            color:var(--navy); font-weight:600; font-size:.78rem;
            cursor:pointer; transition:all .18s;
        }
        .tab-btn.active { background:var(--gold); }
        #hotContainer { width:100%; overflow:hidden; border-radius:12px; }
        /* forcer hauteur Handsontable */
        #hotContainer .handsontable { font-size:.75rem; }

        /* ── STATUT ── */
        .status-bar {
            position:fixed; bottom:12px; right:12px;
            background:#2d4593cc; color:white;
            padding:5px 14px; border-radius:20px;
            font-size:.7rem; pointer-events:none;
            z-index:300; opacity:0; transition:opacity .3s;
        }
        .info-scan { font-size:.68rem; text-align:center; color:#1e6f9f; margin-top:3px; }
        footer { text-align:center; margin-top:.8rem; font-size:.63rem; color:#2c5a7a; }

        @media(max-width:480px){
            .row-two{flex-wrap:wrap}
            .btn-row{justify-content:center}
            .modal-grid.three{grid-template-columns:1fr 1fr}
        }
    </style>
</head>
<body>
<div class="container">

    <!-- HEADER -->
    <div class="header">
        <button class="back-btn" onclick="history.back()">←</button>
        <div class="header-info">
            <div class="header-title">📦 Dlv & Prix</div>
            <div class="header-sub" id="headerSub">Choisissez un emplacement</div>
        </div>
        <span class="badge" id="badge" style="display:none"></span>
    </div>

    <!-- ZONE SAISIE -->
    <div id="zoneSaisie" style="display:none">
        <div class="card">
            <div class="form-vertical">
                <div class="field-group">
                    <label>🔍 Code barre / article *</label>
                    <input type="text" id="codeInput"
                           placeholder="Scanner ou taper (double-clic → scanner)"
                           autocomplete="off">
                    <div class="info-scan">💡 Double-clic sur ce champ pour ouvrir le scanner</div>
                    <div class="desig-text" id="desigText"></div>
                </div>
                <div class="row-two">
                    <div class="field-group">
                        <label>📦 Quantité</label>
                        <input type="number" id="qteInput" value="1" min="1" max="999999" inputmode="numeric">
                    </div>
                    <div class="field-group">
                        <label>💰 Prix Normal (Ar)</label>
                        <input type="number" id="prixInput" placeholder="Ariary" min="0" inputmode="numeric">
                    </div>
                </div>
                <div class="field-group">
                    <label>📅 Dlv — Date de péremption</label>
                    <input type="date" id="dlvInput">
                </div>
            </div>
            <div class="btn-row">
                <button class="btn-add" id="addBtn" disabled>➕ Ajouter</button>
                <button class="btn-nonbase" id="nonBaseBtn">⚠️ Hors base</button>
            </div>
        </div>

        <!-- TABLE LOCALE -->
        <div class="card" style="padding:.8rem">
            <div class="tbl-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Code barre</th><th>Code art.</th><th>Désignation</th>
                            <th>Qté</th><th>Prix (Ar)</th><th>Dlv</th><th></th>
                        </tr>
                    </thead>
                    <tbody id="tblBody">
                        <tr><td colspan="7" style="text-align:center;color:#888;padding:1rem">
                            Aucune ligne. Saisissez un code.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- VISU TABLEUR (double-clic) -->
        <div id="visuSection">
            <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:center;
                            margin-bottom:.8rem;flex-wrap:wrap;gap:.5rem">
                    <strong id="visuTitle" style="color:var(--navy);font-size:.9rem"></strong>
                    <div style="display:flex;gap:.6rem;flex-wrap:wrap">
                        <button class="btn-save"   id="saveVisuBtn">💾 Sauvegarder</button>
                        <button class="btn-cancel" id="closeVisuBtn">✕ Fermer</button>
                    </div>
                </div>
                <div class="tabs" id="visuTabs"></div>
                <div id="hotContainer"></div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL EMPLACEMENT -->
<div id="modalEmpl" class="overlay">
    <div class="modal-box">
        <div class="modal-title">📍 Choisir l'emplacement</div>
        <div class="modal-grid">
            <button class="modal-btn" onclick="choisirEmpl('KIBO4')">🏪 KIBO4</button>
            <button class="modal-btn" onclick="choisirEmpl('KIBO2')">🏬 KIBO2</button>
        </div>
    </div>
</div>

<!-- MODAL CATÉGORIE (simple clic) -->
<div id="modalCat" class="overlay hidden">
    <div class="modal-box">
        <div class="modal-title" id="modalCatTitle">📂 Choisir la catégorie</div>
        <div class="modal-grid three">
            <button class="modal-btn" onclick="choisirCat('Épicerie')">🛒 Épicerie</button>
            <button class="modal-btn" onclick="choisirCat('Boisson')">🥤 Boisson</button>
            <button class="modal-btn" onclick="choisirCat('DPH')">🧴 DPH</button>
        </div>
    </div>
</div>

<!-- MODAL EMPLACEMENT VISU (double-clic) -->
<div id="modalVisuEmpl" class="overlay hidden">
    <div class="modal-box">
        <div class="modal-title">📊 Ouvrir le tableur — quel emplacement ?</div>
        <div class="modal-grid">
            <button class="modal-btn" onclick="ouvrirVisu('KIBO4')">🏪 KIBO4</button>
            <button class="modal-btn" onclick="ouvrirVisu('KIBO2')">🏬 KIBO2</button>
        </div>
    </div>
</div>

<div class="status-bar" id="statusBar">💾 Enregistré</div>

<script>
// ════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════
const DB_URL      = 'https://raw.githubusercontent.com/hasiniainahasina1-art/BOTAKI/main/database.xlsx';
const SHEETS      = ['Épicerie','Boisson','DPH'];
const COLS        = ['Code Barre','Code Article','Désignation','Prix Normal','Prix Promo','Quantité','Dlv'];
const STORE_KEY   = 'BOTAKI_dlv_v3';

// ════════════════════════════════════════════════
// ÉTAT
// ════════════════════════════════════════════════
let empl        = null;   // KIBO4 | KIBO2
let cat         = null;   // Épicerie | Boisson | DPH
let modeDouble  = false;  // true = arrivée via double-clic index.html
let produitsDB  = [];
let lignes      = [];
let lastProduit = null;
let baseOk      = false;
let enCours     = false;

// Handsontable
let hotInstance   = null;
let visuSheets    = {};   // { 'Épicerie': [[row],...], ... }
let activeSheet   = SHEETS[0];
let visuEmpl      = null; // emplacement du tableur ouvert

// ════════════════════════════════════════════════
// DÉTECTION MODE (simple / double clic)
// Paramètre URL : ?mode=view transmis par index.html
// ════════════════════════════════════════════════
(function detectMode() {
    const params = new URLSearchParams(window.location.search);
    modeDouble = params.get('mode') === 'view';
    if (modeDouble) {
        // Cacher zone saisie, afficher direct modal emplacement visu
        document.getElementById('modalEmpl').classList.add('hidden');
        document.getElementById('modalVisuEmpl').classList.remove('hidden');
        document.getElementById('zoneSaisie').style.display = '';
        document.getElementById('headerSub').textContent = 'Mode visualisation — choisissez l\'emplacement';
    }
})();

// ════════════════════════════════════════════════
// MODALS
// ════════════════════════════════════════════════
function choisirEmpl(val) {
    empl = val;
    document.getElementById('modalEmpl').classList.add('hidden');
    document.getElementById('modalCat').classList.remove('hidden');
    document.getElementById('modalCatTitle').textContent = `📂 Catégorie — ${empl}`;
}

function choisirCat(val) {
    cat = val;
    document.getElementById('modalCat').classList.add('hidden');
    majHeader();
    document.getElementById('zoneSaisie').style.display = '';
    chargerLignesLocales();
    renderTable();
    if (!baseOk) chargerBase();
}

function majHeader() {
    document.getElementById('badge').textContent = empl + (cat ? ' › ' + cat : '');
    document.getElementById('badge').style.display = '';
    document.getElementById('headerSub').textContent =
        `Emplacement : ${empl}` + (cat ? ` • Catégorie : ${cat}` : '');
}

// ════════════════════════════════════════════════
// STOCKAGE LOCAL
// ════════════════════════════════════════════════
function storeKey() { return `${STORE_KEY}_${empl}_${cat}`; }

function chargerLignesLocales() {
    try {
        const s = localStorage.getItem(storeKey());
        lignes = s ? JSON.parse(s) : [];
        if (!Array.isArray(lignes)) lignes = [];
    } catch(e) { lignes = []; }
}

function sauvegarderLocal() {
    if (empl && cat) localStorage.setItem(storeKey(), JSON.stringify(lignes));
    showStatus('💾 Sauvegardé localement');
}

// ════════════════════════════════════════════════
// BASE DE DONNÉES PRODUITS
// ════════════════════════════════════════════════
async function chargerBase() {
    try {
        const ctrl = new AbortController();
        const tid  = setTimeout(() => ctrl.abort(), 20000);
        const resp = await fetch(DB_URL, { cache:'no-store', signal:ctrl.signal });
        clearTimeout(tid);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const ab = await resp.arrayBuffer();
        const wb = XLSX.read(ab, { type:'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
        let start = 0;
        if (rows[0] && rows[0][0] && rows[0][0].toString().toLowerCase().includes('code')) start = 1;
        produitsDB = [];
        for (let i = start; i < rows.length; i++) {
            const r = rows[i];
            const cb = (r[0]||'').toString().trim();
            const ca = (r[1]||'').toString().trim();
            const ds = (r[2]||'').toString().trim() || `Produit ${cb||ca}`;
            if (cb||ca) produitsDB.push({ codeBarre:cb, codeArticle:ca, designation:ds });
        }
        baseOk = true;
    } catch(e) { console.error('chargerBase:', e); }
}

// ════════════════════════════════════════════════
// FORMULAIRE SAISIE
// ════════════════════════════════════════════════
const codeInput = document.getElementById('codeInput');
const dlvInput  = document.getElementById('dlvInput');
const desigText = document.getElementById('desigText');
const qteInput  = document.getElementById('qteInput');
const prixInput = document.getElementById('prixInput');
const addBtn    = document.getElementById('addBtn');

function norm(s) { return (s||'').toString().replace(/[\s.\-]/g,''); }

function chercherProduit(id) {
    if (!id.trim() || !baseOk) return null;
    const n = norm(id.trim());
    return produitsDB.find(p => norm(p.codeBarre)===n || norm(p.codeArticle)===n) || null;
}

function majDesig() {
    const code = codeInput.value.trim();
    if (!code) { desigText.textContent=''; lastProduit=null; addBtn.disabled=true; codeInput.className=''; return; }
    const p = chercherProduit(code);
    if (p) {
        desigText.textContent = '✅ ' + p.designation;
        lastProduit = p;
        addBtn.disabled = false;
        codeInput.classList.add('valid'); codeInput.classList.remove('invalid');
    } else {
        desigText.textContent = '❌ Non trouvé';
        lastProduit = null; addBtn.disabled = true;
        codeInput.classList.remove('valid'); codeInput.classList.add('invalid');
    }
}

function resetChamps() {
    codeInput.value=''; dlvInput.value=''; qteInput.value='1'; prixInput.value='';
    desigText.textContent=''; lastProduit=null; addBtn.disabled=true;
    codeInput.className=''; codeInput.focus();
}

function dateFr(dateStr) {
    if (!dateStr) return '';
    const [y,m,d] = dateStr.split('-');
    return `${d}/${m}/${y}`;
}

// ════════════════════════════════════════════════
// TABLE LOCALE
// ════════════════════════════════════════════════
function renderTable() {
    const tb = document.getElementById('tblBody');
    if (!lignes.length) {
        tb.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#888;padding:1rem">Aucune ligne.</td></tr>';
        return;
    }
    tb.innerHTML = lignes.map((l,i) => `
        <tr style="${l.horsBase?'background:#fee2e2':''}">
            <td>${l.codeBarre||'—'}</td>
            <td>${l.codeArticle||'—'}</td>
            <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
                title="${l.designation}">${l.designation}</td>
            <td>${l.quantite}</td>
            <td>${l.prixNormal||0} Ar</td>
            <td>${dateFr(l.dlv)}</td>
            <td><button class="del-btn" onclick="delLigne(${i})">🗑️</button></td>
        </tr>`).join('');
}

function delLigne(i) { lignes.splice(i,1); renderTable(); sauvegarderLocal(); }

// ════════════════════════════════════════════════
// AJOUT
// ════════════════════════════════════════════════
async function ajouterBase() {
    if (!lastProduit) return;
    await envoyerLigne({
        codeBarre:   lastProduit.codeBarre,
        codeArticle: lastProduit.codeArticle,
        designation: lastProduit.designation,
        quantite:    parseInt(qteInput.value)||1,
        prixNormal:  parseFloat(prixInput.value)||0,
        dlv:         dlvInput.value,
        horsBase:    false
    });
}

async function ajouterHorsBase() {
    const code = codeInput.value.trim();
    if (!code) { alert('Saisissez un code.'); return; }
    await envoyerLigne({
        codeBarre:   code.length!==8 ? code : '',
        codeArticle: code.length===8 ? code : '',
        designation: '⚠️ HORS BASE',
        quantite:    parseInt(qteInput.value)||1,
        prixNormal:  parseFloat(prixInput.value)||0,
        dlv:         dlvInput.value,
        horsBase:    true
    });
}

async function envoyerLigne(ligne) {
    if (enCours) return;
    enCours = true; addBtn.disabled = true;
    showStatus('⏳ Envoi en cours…');
    try {
        const resp = await fetch('/api/upload-dlv', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ emplacement:empl, categorie:cat, ligne, mode:'write' })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error||'Erreur serveur');
        lignes.unshift(ligne);
        renderTable(); sauvegarderLocal();
        showStatus('✅ Enregistré sur GitHub');
        resetChamps();
    } catch(e) {
        showStatus('❌ ' + e.message);
        alert('Erreur : ' + e.message);
    } finally { enCours=false; addBtn.disabled=false; }
}

// ════════════════════════════════════════════════
// VISUALISATION TABLEUR (Handsontable)
// ════════════════════════════════════════════════
async function ouvrirVisu(emplVal) {
    visuEmpl = emplVal;
    document.getElementById('modalVisuEmpl').classList.add('hidden');
    document.getElementById('zoneSaisie').style.display = '';
    document.getElementById('visuSection').style.display = '';
    document.getElementById('visuTitle').textContent = `📊 Tableur — dlv_${visuEmpl}.xlsx`;

    if (!empl) { empl = visuEmpl; majHeader(); }

    document.getElementById('hotContainer').innerHTML =
        '<div style="text-align:center;padding:1.5rem;color:#888">⏳ Chargement du fichier Excel…</div>';

    try {
        const resp = await fetch('/api/upload-dlv', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ emplacement:visuEmpl, categorie: cat||'Épicerie', mode:'read' })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error||'Erreur serveur');

        if (!data.exists) {
            document.getElementById('hotContainer').innerHTML =
                '<div style="text-align:center;padding:1.5rem;color:#888">Aucune donnée pour cet emplacement.</div>';
            return;
        }

        visuSheets = data.sheets;
        activeSheet = cat || SHEETS[0];
        renderTabs();
        renderHot();
    } catch(e) {
        document.getElementById('hotContainer').innerHTML =
            `<div style="text-align:center;padding:1rem;color:red">❌ ${e.message}</div>`;
    }
}

function renderTabs() {
    document.getElementById('visuTabs').innerHTML = SHEETS.map(s =>
        `<button class="tab-btn ${s===activeSheet?'active':''}" onclick="switchTab('${s}')">${s}</button>`
    ).join('');
}

function switchTab(s) {
    // Sauvegarder les données du HOT avant de changer d'onglet
    if (hotInstance) {
        visuSheets[activeSheet] = hotInstance.getData();
        // Remettre les en-têtes
        visuSheets[activeSheet].unshift(COLS);
    }
    activeSheet = s;
    renderTabs();
    renderHot();
}

function renderHot() {
    const container = document.getElementById('hotContainer');
    container.innerHTML = '';

    const allRows = visuSheets[activeSheet] || [];
    // Séparer en-tête et données
    let dataRows = allRows.length > 1 ? allRows.slice(1) : [Array(COLS.length).fill('')];

    // Trier par Dlv (colonne 6) — date la plus récente en haut
    // Format attendu : DD/MM/YYYY ou YYYY-MM-DD
    function dlvVersTimestamp(val) {
        if (!val) return -Infinity;
        const s = val.toString().trim();
        // Format DD/MM/YYYY
        const m1 = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
        if (m1) return new Date(m1[3], m1[2]-1, m1[1]).getTime();
        // Format YYYY-MM-DD
        const m2 = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (m2) return new Date(m2[1], m2[2]-1, m2[3]).getTime();
        return -Infinity;
    }
    dataRows = dataRows.slice().sort((a, b) => dlvVersTimestamp(b[6]) - dlvVersTimestamp(a[6]));

    if (hotInstance) { hotInstance.destroy(); hotInstance = null; }

    const isMobile = window.innerWidth < 600;
    const colWidths = isMobile
        ? [80,80,120,70,70,60,80]
        : [110,110,180,100,100,80,100];

    hotInstance = new Handsontable(container, {
        data: dataRows,
        colHeaders: COLS,
        rowHeaders: true,
        height: Math.min(500, Math.max(200, dataRows.length * 26 + 60)),
        width: '100%',
        colWidths: colWidths,
        licenseKey: 'non-commercial-and-evaluation',
        stretchH: 'all',
        contextMenu: true,
        manualColumnResize: true,
        manualRowResize: true,
        filters: true,
        dropdownMenu: true,
        autoWrapRow: true,
        autoWrapCol: true,
        afterChange(changes) {
            if (!changes) return;
            // Mettre à jour visuSheets en temps réel
            const rows = [COLS, ...hotInstance.getData()];
            visuSheets[activeSheet] = rows;
        }
    });
}

// Sauvegarder vers GitHub
document.getElementById('saveVisuBtn').onclick = async () => {
    // Récupérer les dernières données du tableur
    if (hotInstance) {
        visuSheets[activeSheet] = [COLS, ...hotInstance.getData()];
    }
    showStatus('⏳ Sauvegarde en cours…');
    try {
        const resp = await fetch('/api/upload-dlv', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ emplacement:visuEmpl, categorie:cat||'Épicerie', sheets:visuSheets, mode:'save' })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error||'Erreur');
        showStatus('✅ Sauvegardé sur GitHub');
    } catch(e) {
        showStatus('❌ ' + e.message);
        alert('Erreur sauvegarde : ' + e.message);
    }
};

document.getElementById('closeVisuBtn').onclick = () => {
    document.getElementById('visuSection').style.display = 'none';
    if (hotInstance) { hotInstance.destroy(); hotInstance = null; }
};
