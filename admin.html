<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Admin - arrayBuffer</title>
</head>
<body style="background:#1e2f6b; color:white; font-family:sans-serif; padding:20px;">
    <h2>Test Admin (sans FileReader)</h2>
    <input type="file" id="fileInput"><br><br>
    <button onclick="testUpload('replace')">Remplacer</button>
    <button onclick="testUpload('append')">Ajouter</button>
    <div id="msg"></div>

    <script>
        async function testUpload(mode) {
            const file = document.getElementById('fileInput').files[0];
            if (!file) { alert('Sélectionnez un fichier'); return; }
            document.getElementById('msg').innerText = 'Envoi en cours...';

            try {
                // Lecture du fichier en ArrayBuffer (plus fiable)
                const buffer = await file.arrayBuffer();
                const base64 = arrayBufferToBase64(buffer);

                const resp = await fetch('/api/upload-base', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fileBase64: base64,
                        fileName: 'database.xlsx',   // ou CADENCIER.xlsx pour le cadenceur
                        mode: mode
                    })
                });

                const text = await resp.text();
                document.getElementById('msg').innerText = 'Réponse: ' + text;
            } catch (err) {
                document.getElementById('msg').innerText = 'Erreur: ' + err.message;
                console.error(err);
            }
        }

        // Conversion ArrayBuffer -> base64
        function arrayBufferToBase64(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = '';
            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }
    </script>
</body>
</html>
