<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Admin</title>
</head>
<body style="background:#1e2f6b; color:white; font-family:sans-serif; padding:20px;">
    <h2>Test Admin</h2>
    <input type="file" id="fileInput"><br><br>
    <button onclick="testUpload('replace')">Remplacer</button>
    <button onclick="testUpload('append')">Ajouter</button>
    <div id="msg"></div>

    <script>
        async function testUpload(mode) {
            const file = document.getElementById('fileInput').files[0];
            if (!file) { alert('Sélectionnez un fichier'); return; }
            document.getElementById('msg').innerText = 'Envoi...';
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64 = e.target.result.split(',')[1];
                try {
                    const resp = await fetch('/api/upload-base', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            fileBase64: base64,
                            fileName: 'database.xlsx',
                            mode: mode
                        })
                    });
                    const text = await resp.text();
                    document.getElementById('msg').innerText = 'Réponse: ' + text;
                } catch(err) {
                    document.getElementById('msg').innerText = 'Erreur: ' + err.message;
                }
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
