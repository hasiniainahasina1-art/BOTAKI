<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - BOTAKI</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-deep: #131c42;
            --navy: #1e2f6b;
            --gold: #f4b400;
            --gold-light: #ffd54f;
            --ink: #f5f6fb;
        }
        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--navy-deep), var(--navy));
            color: var(--ink); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
        }
        .admin-container { max-width: 700px; width: 100%; }
        .card {
            background: rgba(255,255,255,0.06); backdrop-filter: blur(8px);
            border: 1px solid rgba(244,180,0,0.2); border-radius: 20px; padding: 24px; margin-bottom: 20px;
        }
        h2 { color: var(--gold-light); margin: 0 0 16px; }
        input[type="file"] { width: 100%; padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(244,180,0,0.3); color: white; margin-bottom: 12px; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            padding: 10px 20px; border-radius: 12px; font-weight: 600; font-size: 0.9rem; cursor: pointer; border: none; transition: 0.2s;
        }
        .btn-gold { background: var(--gold); color: var(--navy-deep); }
        .btn-gold:hover { background: var(--gold-light); }
        .btn-outline { background: transparent; border: 1px solid rgba(244,180,0,0.4); color: var(--gold-light); }
        .btn-outline:hover { background: rgba(244,180,0,0.1); }
        .message { padding: 8px 12px; border-radius: 8px; margin-top: 10px; font-size: 0.9rem; display: none; }
        .message.success { background: rgba(16,185,129,0.2); color: #10b981; display: block; }
        .message.error { background: rgba(239,68,68,0.2); color: #ef4444; display: block; }
        #login-message { text-align: center; margin-bottom: 16px; }
        input[type="password"] {
            width: 100%; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(244,180,0,0.3); color: white; margin-bottom: 16px;
        }

        /* Modale (uniquement pour l'ajout manuel en cas d'échec de la détection) */
        .modal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 2000;
        }
        .modal.open { display: flex; }
        .modal-content {
            background: linear-gradient(165deg, var(--navy) 0%, var(--navy-deep) 100%);
            border: 1px solid rgba(244,180,0,0.4); border-radius: 20px;
            padding: 24px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto;
        }
        .mapping-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
        .mapping-row select { flex:1; padding: 8px; border-radius: 8px; background: rgba(255,255,255,0.1); border:1px solid var(--gold); color:white; }
        .sample-table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 0.8rem; }
        .sample-table th { background: rgba(244,180,0,0.2); padding: 6px; }
        .sample-table td { padding: 4px; border-bottom: 1px solid rgba(244,180,0,0.2); }
    </style>
</head>
<body>
<div class="admin-container" id="login-block">
    <div class="card" style="text-align: center;">
        <h2>🔐 Administration BOTAKI</h2>
        <p style="margin-bottom: 20px;">Veuillez entrer le mot de passe pour accéder à cette page.</p>
        <input type="password" id="passwordInput" placeholder="Mot de passe">
        <button class="btn btn-gold" onclick="checkPassword()">Valider</button>
        <div id="login-message" class="message"></div>
    </div>
</div>

<div class="admin-container" id="admin-content" style="display: none;">
    <div class="card">
        <h2>📚 Base articles (database.xlsx)</h2>
        <input type="file" id="databaseFile" accept=".xlsx, .xls">
        <div class="btn-group">
            <button class="btn btn-gold" onclick="handleUpload('database', 'replace')">Remplacer</button>
            <button class="btn btn-outline" onclick="handleUpload('database', 'append')">Ajouter des produits</button>
        </div>
        <div id="db-message" class="message"></div>
    </div>

    <div class="card">
        <h2>📋 Cadenceur (CADENCIER.xlsx)</h2>
        <input type="file" id="cadencierFile" accept=".xlsx, .xls">
        <div class="btn-group">
            <button class="btn btn-gold" onclick="handleUpload('cadencier', 'replace')">Remplacer</button>
            <button class="btn btn-outline" onclick="handleUpload('cadencier', 'append')">Ajouter des produits</button>
        </div>
        <div id="cad-message" class="message"></div>
    </div>
</div>

<!-- Modale de mapping (ajout) -->
<div id="mappingModal" class="modal">
    <div class="modal-content">
        <h3>📋 Associer les colonnes</h3>
        <p>Le fichier ne contient pas les en-têtes attendus. Veuillez indiquer la correspondance.</p>
        <div id="sampleContainerMapping"></div>
        <div id="mappingFields"></div>
        <div class="btn-group" style="justify-content: center; margin-top: 20px;">
            <button class="btn btn-gold" onclick="applyMappingAndUpload()">Valider et ajouter</button>
            <button class="btn btn-outline" onclick="closeMappingModal()">Annuler</button>
        </div>
    </div>
</div>

<script>
    // ---- Authentification ----
    if (sessionStorage.getItem('adminAuthenticated') === 'true') showAdmin();

    async function checkPassword() {
        const password = document.getElementById('passwordInput').value;
        const msgEl = document.getElementById('login-message');
        try {
            const resp = await fetch('/api/check-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const data = await resp.json();
            if (data.success) {
                sessionStorage.setItem('adminAuthenticated', 'true');
                showAdmin();
            } else {
                msgEl.className = 'message error';
                msgEl.textContent = 'Mot de passe incorrect.';
            }
        } catch(e) {
            msgEl.className = 'message error';
            msgEl.textContent = 'Erreur de connexion.';
        }
    }

    function showAdmin() {
        document.getElementById('login-block').style.display = 'none';
        document.getElementById('admin-content').style.display = 'block';
    }

    // ---- Gestion du fichier (lecture unique) ----
    async function readFile(file) {
        const buffer = await file.arrayBuffer();
        const base64 = arrayBufferToBase64(buffer);
        const workbook = XLSX.read(buffer, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        return { base64, rows };
    }

    // Conversion sécurisée ArrayBuffer -> base64 (par morceaux)
    function arrayBufferToBase64(buffer) {
        let binary = '';
        const bytes = new Uint8Array(buffer);
        const chunkSize = 8192;
        for (let i = 0; i < bytes.length; i += chunkSize) {
            binary += String.fromCharCode(...bytes.slice(i, i + chunkSize));
        }
        return btoa(binary);
    }

    // Détection automatique des indices de colonnes à partir d'une ligne d'en-tête
    function detectHeaderIndices(headerRow, targetColumns) {
        const indices = {};
        const clean = headerRow.map(c => (c || '').toString().toLowerCase().trim());
        targetColumns.forEach(col => {
            const idx = clean.findIndex(c => c.includes(col.toLowerCase()));
            if (idx !== -1) indices[col] = idx;
        });
        return indices;
    }

    // Réorganise les rows selon les colonnes cibles et le mapping (indices)
    function reorderRows(rows, targetColumns, mapping, dataStart = 0) {
        const newRows = [targetColumns]; // en-tête standard
        for (let r = dataStart; r < rows.length; r++) {
            const row = rows[r];
            const newRow = targetColumns.map(col => {
                const idx = mapping[col];
                return (idx !== undefined && row[idx] !== undefined) ? row[idx] : '';
            });
            newRows.push(newRow);
        }
        return newRows;
    }

    // Génère un nouveau base64 à partir des lignes réorganisées
    function rebuildBase64(rows) {
        const newWorkbook = XLSX.utils.book_new();
        const newSheet = XLSX.utils.aoa_to_sheet(rows);
        XLSX.utils.book_append_sheet(newWorkbook, newSheet, 'Feuille1');
        const newBuffer = XLSX.write(newWorkbook, { type: 'array', bookType: 'xlsx' });
        return arrayBufferToBase64(newBuffer);
    }

    // ---- Envoi à l'API ----
    async function uploadBase64(type, fileBase64, mode, msgEl) {
        msgEl.className = 'message';
        msgEl.textContent = 'Envoi en cours...';
        msgEl.style.display = 'block';

        try {
            const resp = await fetch('/api/upload-base', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fileBase64: fileBase64,
                    fileName: type === 'database' ? 'database.xlsx' : 'CADENCIER.xlsx',
                    mode: mode
                })
            });
            let result;
            const contentType = resp.headers.get('content-type');
            if (contentType && contentType.includes('application/json')) {
                result = await resp.json();
            } else {
                const text = await resp.text();
                throw new Error('Réponse inattendue du serveur : ' + text.slice(0, 200));
            }
            if (resp.ok && result.success) {
                msgEl.className = 'message success';
                msgEl.textContent = mode === 'replace' ? 'Fichier remplacé avec succès !' : 'Produits ajoutés avec succès !';
            } else {
                msgEl.className = 'message error';
                msgEl.textContent = 'Erreur : ' + (result.error || 'Erreur inconnue');
            }
        } catch(ex) {
            msgEl.className = 'message error';
            msgEl.textContent = 'Erreur réseau : ' + ex.message;
        }
    }

    // ---- Actions principales ----
    let pendingMappingData = null; // pour la modale d'ajout manuel

    async function handleUpload(type, mode) {
        const fileInput = document.getElementById(type === 'database' ? 'databaseFile' : 'cadencierFile');
        const msgEl = document.getElementById(type === 'database' ? 'db-message' : 'cad-message');
        const file = fileInput.files[0];
        if (!file) {
            msgEl.className = 'message error';
            msgEl.textContent = 'Veuillez sélectionner un fichier.';
            return;
        }

        msgEl.className = '';
        msgEl.style.display = 'none';

        try {
            const { base64, rows } = await readFile(file);
            if (rows.length === 0) throw new Error('Fichier vide');

            const targetColumns = type === 'database' 
                ? ['Code barre', 'Code article', 'Désignation'] 
                : ['Code barre', 'Code article', 'Désignation', 'PCB', 'Fournisseur'];

            const headerRow = rows[0];
            const hasHeader = headerRow && headerRow.some(cell => {
                const val = (cell || '').toString().toLowerCase().trim();
                return ['code', 'barre', 'article', 'designation', 'pcb', 'fournisseur'].some(key => val.includes(key));
            });

            if (!hasHeader) {
                // Pas d'en-tête détecté, on ne peut pas faire de remplacement automatique ni d'ajout fiable
                if (mode === 'replace') {
                    msgEl.className = 'message error';
                    msgEl.textContent = 'Le fichier doit contenir une ligne d\'en-tête avec les mots-clés (Code barre, Code article, Désignation…).';
                } else {
                    // Ajout : on propose un mapping manuel
                    pendingMappingData = { type, base64, rows, targetColumns };
                    openMappingModal(rows, targetColumns);
                }
                return;
            }

            // Détection automatique
            const detected = detectHeaderIndices(headerRow, targetColumns);
            const missing = targetColumns.filter(col => !(col in detected));

            if (mode === 'replace') {
                if (missing.length > 0) {
                    msgEl.className = 'message error';
                    msgEl.textContent = 'Colonnes obligatoires manquantes : ' + missing.join(', ') + '. Veuillez vérifier l\'en-tête.';
                    return;
                }
                // Réorganiser et envoyer directement
                const newRows = reorderRows(rows, targetColumns, detected, 1); // saute l'ancien en-tête
                const newBase64 = rebuildBase64(newRows);
                await uploadBase64(type, newBase64, 'replace', msgEl);
            } else { // append
                if (missing.length === 0) {
                    // Envoi direct avec le fichier original (l'API se chargera de fusionner les colonnes correctement via son propre mapping)
                    await uploadBase64(type, base64, 'append', msgEl);
                } else {
                    // Proposer mapping manuel
                    pendingMappingData = { type, base64, rows, targetColumns };
                    openMappingModal(rows, targetColumns);
                }
            }
        } catch(e) {
            msgEl.className = 'message error';
            msgEl.textContent = 'Erreur : ' + e.message;
        }
    }

    // ---- Modale de mapping (pour l'ajout) ----
    function openMappingModal(rows, targetColumns) {
        const sampleCount = Math.min(5, rows.length);
        let html = '<table class="sample-table"><thead><tr>';
        for (let i = 0; i < (rows[0] ? rows[0].length : 0); i++) {
            html += `<th>Colonne ${i+1}</th>`;
        }
        html += '</tr></thead><tbody>';
        for (let r = 0; r < sampleCount; r++) {
            html += '<tr>';
            for (let c = 0; c < (rows[r] ? rows[r].length : 0); c++) {
                html += `<td>${escapeHtml(rows[r][c] || '')}</td>`;
            }
            html += '</tr>';
        }
        html += '</tbody></table>';
        document.getElementById('sampleContainerMapping').innerHTML = html;

        const maxCols = rows.reduce((max, row) => Math.max(max, row.length), 0);
        const options = Array.from({ length: maxCols }, (_, i) => `<option value="${i}">Colonne ${i+1}</option>`);
        options.unshift('<option value="-1">-- Ignorer --</option>');

        let fieldsHtml = '';
        targetColumns.forEach(col => {
            fieldsHtml += `<div class="mapping-row">
                <label style="width:120px;">${col} :</label>
                <select id="map_${col.replace(/\s/g,'')}">${options.join('')}</select>
            </div>`;
        });
        document.getElementById('mappingFields').innerHTML = fieldsHtml;

        // Présélection automatique si l'en-tête est partiellement reconnu
        if (rows.length > 0) {
            const header = rows[0];
            const detected = detectHeaderIndices(header, targetColumns);
            targetColumns.forEach(col => {
                const sel = document.getElementById('map_' + col.replace(/\s/g,''));
                if (sel && detected[col] !== undefined) {
                    sel.value = detected[col];
                }
            });
        }

        document.getElementById('mappingModal').classList.add('open');
    }

    function closeMappingModal() {
        document.getElementById('mappingModal').classList.remove('open');
        pendingMappingData = null;
    }

    async function applyMappingAndUpload() {
        if (!pendingMappingData) return;
        const { type, base64, rows, targetColumns } = pendingMappingData;
        const msgEl = document.getElementById(type === 'database' ? 'db-message' : 'cad-message');

        const mapping = {};
        targetColumns.forEach(col => {
            const sel = document.getElementById('map_' + col.replace(/\s/g,''));
            if (sel && sel.value !== '-1') {
                mapping[col] = parseInt(sel.value);
            }
        });

        const missing = targetColumns.filter(col => !(col in mapping));
        if (missing.length > 0) {
            alert('Veuillez associer toutes les colonnes obligatoires : ' + missing.join(', '));
            return;
        }

        // Réorganiser et envoyer
        const hasHeader = rows[0] && rows[0].some(cell => {
            const val = (cell || '').toString().toLowerCase().trim();
            return ['code', 'barre', 'article', 'designation', 'pcb', 'fournisseur'].some(key => val.includes(key));
        });
        const dataStart = hasHeader ? 1 : 0;
        const newRows = reorderRows(rows, targetColumns, mapping, dataStart);
        const newBase64 = rebuildBase64(newRows);

        await uploadBase64(type, newBase64, 'append', msgEl);
        closeMappingModal();
    }

    function escapeHtml(text) {
        return String(text).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    }
</script>
</body>
</html>
